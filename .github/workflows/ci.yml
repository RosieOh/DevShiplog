name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 PR 에 연달아 푸시하면 앞의 실행을 취소한다.
# 어차피 볼 것은 마지막 커밋의 결과다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 · 테스트
    runs-on: ubuntu-latest
    services:
      # 앱이 실제로 Redis 를 쓴다 (Celery 브로커, 레이트리밋, 캐시 무효화 팬아웃).
      # 없어도 대부분 통과하지만, 없는 채로 도는 CI 는 그 경로를 검증하지 못한다.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 테스트
        working-directory: backend
        env:
          # 테스트는 인메모리 SQLite 를 쓴다. DATABASE_URL 은 임포트 시점에만 필요하다.
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          OPENAI_API_KEY: sk-test-not-a-real-key
          REDIS_URL: redis://localhost:6379/0
          # 저장소를 붙이지 않는다. 업로드 테스트는 가짜 저장소로 포트 계약만 검증한다.
          STORAGE_BACKEND: local
        run: pytest -q

  migrations:
    name: 백엔드 · 마이그레이션 (MariaDB)
    runs-on: ubuntu-latest
    # SQLite 테스트로는 안 잡히는 것을 잡기 위한 잡이다.
    # 실제로 MariaDB 에만 없는 기능(ngram 파서)과 제약(IN 안의 LIMIT)에 걸린 적이 있다.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: devshiplog
          MARIADB_USER: devshiplog
          MARIADB_PASSWORD: devshiplog
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 마이그레이션 적용
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://devshiplog:devshiplog@127.0.0.1:3306/devshiplog
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: alembic upgrade head

      - name: 되돌리기까지 동작하는지
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://devshiplog:devshiplog@127.0.0.1:3306/devshiplog
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          OPENAI_API_KEY: sk-test-not-a-real-key
        # downgrade 를 안 해보면, 문제가 생겼을 때 되돌릴 수 있는지 배포 중에 알게 된다.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: 모델과 마이그레이션이 어긋나지 않았는지
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://devshiplog:devshiplog@127.0.0.1:3306/devshiplog
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          OPENAI_API_KEY: sk-test-not-a-real-key
        # 모델만 고치고 마이그레이션을 빠뜨리면 배포 후에야 드러난다.
        run: |
          alembic revision --autogenerate -m "drift check" --rev-id drift_check
          # 파일이 안 만들어졌으면 검사가 돈 것이 아니다.
          # 이 확인이 없으면 autogenerate 실패가 '어긋남 없음' 으로 새어나간다.
          if [ ! -f alembic/versions/drift_check_drift_check.py ]; then
            echo "::error::autogenerate 가 리비전을 만들지 못했습니다 — 검사가 돌지 않았습니다"
            exit 1
          fi
          if grep -qE '^\s+op\.(create|drop|add|alter)' alembic/versions/drift_check_*.py; then
            echo "::error::모델과 마이그레이션이 어긋납니다. 아래 변경이 누락되었습니다:"
            grep -E '^\s+op\.' alembic/versions/drift_check_*.py
            exit 1
          fi
          echo "어긋남 없음"

  frontend:
    name: 프론트엔드 · 타입·린트·빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 타입 검사
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 린트
        working-directory: frontend
        # 경고는 통과시키되 오류는 막는다. 경고까지 막으면 사람들이 규칙을 끈다.
        run: npx eslint . --ext .ts,.tsx --max-warnings 5

      - name: 빌드
        working-directory: frontend
        env:
          # 빌드 시점에 실제 백엔드가 필요하지는 않다. 값이 있기만 하면 된다.
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-only-secret
        run: npm run build

  integration:
    name: 통합 · E2E + 브라우저
    runs-on: ubuntu-latest
    # 유닛 테스트가 통과해야 의미가 있다. 먼저 깨지면 여기서 시간 쓸 이유가 없다.
    needs: [backend, frontend]
    services:
      # MariaDB 는 services 로 띄우지 않는다.
      # services 의 options 는 `docker create` 에 전달되므로 서버 플래그
      # (--innodb-ft-min-token-size)를 줄 수 없다. 아래 스텝에서 직접 띄운다.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports: ['1025:1025', '8025:8025']

    env:
      DATABASE_URL: mysql+pymysql://devshiplog:devshiplog@127.0.0.1:3306/devshiplog
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      OPENAI_API_KEY: sk-test-not-a-real-key
      ENVIRONMENT: test
      STORAGE_BACKEND: s3
      STORAGE_S3_BUCKET: devshiplog
      STORAGE_S3_ACCESS_KEY: devshiplog
      STORAGE_S3_SECRET_KEY: devshiplog1234
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ENDPOINT: http://localhost:9000
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/devshiplog
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USE_TLS: 'false'
      FRONTEND_ORIGIN: http://localhost:3000
      REVALIDATE_SECRET: ci-revalidate-secret
      E2E_API: http://localhost:8000
      E2E_WEB: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: MariaDB · MinIO 기동
        # 전문검색 최소 토큰 길이를 2로 내려야 "자바" 같은 2글자 한국어가 색인된다.
        # 기본값 3에서는 검색해도 결과가 0이다.
        run: |
          docker run -d --name ci-mariadb -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=rootpassword \
            -e MARIADB_DATABASE=devshiplog \
            -e MARIADB_USER=devshiplog \
            -e MARIADB_PASSWORD=devshiplog \
            mariadb:10.11 --innodb-ft-min-token-size=2 --ft-min-word-len=2

          for i in $(seq 1 40); do
            docker exec ci-mariadb healthcheck.sh --connect --innodb_initialized && break
            sleep 3
          done

          # 플래그가 실제로 먹었는지 확인한다. 안 먹으면 2글자 검색 테스트가
          # 조용히 0건을 돌려주고, 그건 "검색이 안 된다" 와 구분이 안 된다.
          docker exec ci-mariadb mariadb -uroot -prootpassword \
            -e "SHOW VARIABLES LIKE 'innodb_ft_min_token_size';" | grep -q "	2" \
            || { echo "::error::innodb_ft_min_token_size 가 2가 아닙니다"; exit 1; }

      - name: 백엔드 의존성
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 마이그레이션
        working-directory: backend
        run: alembic upgrade head

      - name: 백엔드 기동
        working-directory: backend
        run: |
          uvicorn src.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health

      - name: 프론트엔드 빌드·기동
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-nextauth-secret
          REVALIDATE_SECRET: ci-revalidate-secret
          REDIS_URL: redis://localhost:6379/0
        run: |
          npm ci
          npm run build
          PORT=3000 npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/ > /dev/null

      - name: API E2E
        run: |
          python e2e/platform_e2e.py
          python e2e/features_e2e.py
          python e2e/improve_e2e.py

      - name: 브라우저 검증
        working-directory: e2e/browser
        env:
          # setup-node 러너에 Chrome 이 깔려 있다.
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-package-lock
          node features_ui.mjs
          node improve_ui.mjs
          node check.mjs > design-report.json
          python3 - <<'PY'
          import json
          report = json.load(open("design-report.json", encoding="utf-8"))
          bad = [f for f in report["findings"] if f["type"] in ("contrast", "overflow")]
          if bad:
              print("::error::대비/오버플로 문제:", json.dumps(bad, ensure_ascii=False)[:800])
              raise SystemExit(1)
          print("대비·오버플로 문제 없음")
          PY

      - name: 실패 시 화면 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: e2e/browser/shots/
          if-no-files-found: ignore
