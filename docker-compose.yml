version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: devshiplog-db
    # 전문검색 최소 토큰 길이를 2로 내린다.
    #
    # 기본값(InnoDB 3자, MyISAM 4자)에서는 "자바", "리눅스" 같은 짧은 한국어 낱말이
    # 아예 색인되지 않아 검색해도 안 나온다. 영어는 3자 미만 낱말이 대개 불용어라
    # 문제가 없지만 한국어는 다르다.
    #
    # 주의: 이 값을 바꾸면 기존 FULLTEXT 인덱스를 다시 만들어야 반영된다
    # (ALTER TABLE posts DROP INDEX ft_posts_title_body; 후 마이그레이션 재적용).
    command: >-
      --innodb-ft-min-token-size=2
      --ft-min-word-len=2
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devshiplog
      MYSQL_USER: devshiplog
      MYSQL_PASSWORD: devshiplog
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devshiplog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 업로드 이미지 저장소.
  #
  # 로컬 디스크를 쓰지 않는 이유: 서버를 2대 이상 띄우면 A 에 올린 파일을 B 가 못 찾고,
  # 컨테이너를 재배포하면 사라진다. MinIO 는 S3 와 API 가 같아서 개발과 운영이
  # 같은 코드로 돌고, 나중에 AWS 로 옮길 때 엔드포인트만 비우면 된다.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: devshiplog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devshiplog
      MINIO_ROOT_PASSWORD: devshiplog1234
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # 웹 콘솔
    volumes:
      - minio_data:/data
    healthcheck:
      # /minio/health/live 는 인증 없이 열려 있다.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 개발용 메일 서버.
  #
  # 진짜 메일을 보내지 않고 받아서 보여준다. 이게 없으면 비밀번호 재설정 흐름을
  # "로그에 찍혔으니 됐겠지" 로만 확인하게 되고, 실제 SMTP 경로는 배포 후에 처음 돈다.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: devshiplog-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # 웹 UI + API
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
  redis_data:
  minio_data:

